- hosts: localhost
  become: true
  tasks:
    - name: Install libvirt
      apt:
        pkg:
           - libvirt-daemon
           - libvirt-daemon-system
           - libvirt-clients
           - qemu-kvm
           - virt-manager
           - qemu-utils
           - vagrant
           - virtiofsd
        state: latest
        update_cache: true
      tags:
        - deb

    - name: Install libvirt
      pacman:
        name:
          - libvirt
          - qemu-full
          - virt-manager
          - vagrant
        state: latest
        update_cache: true
      tags:
        - arch
    
    - name: Start libvirt
      ansible.builtin.service: 
        name: libvirtd
        state: started
        enabled: yes
