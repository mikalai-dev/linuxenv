- hosts: localhost
  become: yes
  tasks:
    - name: Install dependencies
      apt:
        pkg:
          - alacritty
        state: latest
        update_cache: true
      tags:
        - deb

    - name: Install alacritty
      pacman:
        name: alacritty
        state: latest
        update_cache: true
      tags:
        - arch

    - name: Copy alacritty config
     copy:
        src: ../configs/dotfiles/alacritty.yml
        dest: ~/.config
     tags:
       - arch
       - deb
         
