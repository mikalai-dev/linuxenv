- hosts: all
  become: true
  tasks:
    - name: Ensure keyrings directory exists
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'
      tags:
        - deb

    - name: Download Vivaldi GPG key
      get_url:
        url: https://repo.vivaldi.com/stable/linux_signing_key.pub
        dest: /etc/apt/keyrings/vivaldi.asc
        mode: '0644'
      tags:
        - deb

    - name: Add Vivaldi repository
      apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/vivaldi.asc] https://repo.vivaldi.com/stable/deb/ stable main"
        state: present
        filename: vivaldi
      tags:
        - deb

    - name: Install Vivaldi
      apt:
        name: vivaldi-stable
        state: latest
        update_cache: true
      tags:
        - deb

    - name: Install Vivaldi
      pacman:
        name: vivaldi
        state: present
        update_cache: true
      tags:
        - arch
